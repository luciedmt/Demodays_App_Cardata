    function playClickSound() {
      try {
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.frequency.setValueAtTime(900, now);
        osc.frequency.exponentialRampToValueAtTime(500, now + 0.04);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0, now + 0.04);

            { label: '♥️', onClick: () => app.toggleHeart(5), heartSelected: app.ratingHearts.includes(5), inactive: false },
            { label: ':)', isBackBtn: true, onClick: () => {}, inactive: true },
            { isLogo: true, onClick: () => goTo('home') }
          );
          break;

        default:
          buttons.push(
            { label: '', onClick: () => {}, inactive: true },
            { label: '', onClick: () => {}, inactive: true },
            { label: '', onClick: () => {}, inactive: true },
            { label: '', onClick: () => {}, inactive: true },
            { label: '', onClick: () => {}, inactive: true },
            { label: '', onClick: () => {}, inactive: true },
            { label: '<', isBackBtn: true, onClick: () => goTo('home'), inactive: false },
            { isLogo: true, onClick: () => goTo('home') }
          );
      }

      return buttons;
    }

    app.validateAndLogin = async function() {
      const emailInput = document.getElementById('emailInput');
      const email = emailInput?.value.trim() || '';
      
      if (!email) {
        app.emailError = 'Please enter an email address';
        render();
        return;
      }
      
      if (!validateEmail(email)) {
        app.emailError = 'Please enter a valid email (format: name@domain.com)';
        render();
        return;
      }
      
      app.email = email;
      await saveParticipant();
      localStorage.setItem('userEmail', email);
      goTo('home');
    };

       // console.log("EMAIL STATUS =", emailResponse.status)

        //localStorage.setItem(

        //);

        //goTo('bookConfirm');

          'bookings',

        );
//////////////////////////////////////////////////////////////////////////////////////////////////////////////
        app.lastBooking = {

    app.selectTimeslot = function(index) {
      playClickSound();
      app.selectedTimeslot = app.selectedTimeslot === index ? null : index;
      render();
    };

    app.selectAnswer = function(index) {
      playClickSound();
      app.selectedAnswer = app.selectedAnswer === index ? null : index;
      render();
    };

    app.toggleHeart = async function(index) {
      playClickSound();
      if (app.ratingHearts.includes(index)) {
        app.ratingHearts = app.ratingHearts.filter(i => i !== index);
      } else {
        app.ratingHearts.push(index);
      }
      localStorage.setItem('ratingHearts', JSON.stringify(app.ratingHearts));
      await saveParticipant();
      render();
    };

    app.nextQuestion = async function() {
      if (app.selectedAnswer !== null) {
        app.quizAnswers[app.currentQuestion] = app.selectedAnswer;
        await saveParticipant();
        localStorage.setItem('quizAnswers', JSON.stringify(app.quizAnswers));

        if (app.currentQuestion < 5) {
          goTo('question', app.currentQuestion + 1);
        } else {
          goTo('myQuiz');
        }
      }
    };

async function saveParticipant() {

    if (!app.email) return;

    const { data, error } = await supabaseClient
        .from('participants')
        .upsert(
            {
                email: app.email,
                bookings: app.bookings,
                quiz_answers: app.quizAnswers,
                rating: app.ratingHearts.length,
                updated_at: new Date().toISOString()
            },
            {
                onConflict: 'email'
            }
        )
        .select();

    if (error) {
        console.error("Erreur Supabase :", error);
    }
}

    function addToOutlook(demoName, startDate) {

      const start = new Date(startDate);
      const end = new Date(start.getTime() + 15 * 60000);
    
      const link =
        "https://outlook.office.com/calendar/0/deeplink/compose?" +
        "subject=" + encodeURIComponent(demoName) +
        "&startdt=" + encodeURIComponent(start.toISOString()) +
        "&enddt=" + encodeURIComponent(end.toISOString()) +
        "&location=" + encodeURIComponent("Ruch std 56") +
        "&body=" + encodeURIComponent("CarData DemoDays 2026");
    
      window.open(link, "_blank");
    }

    function render() {
      if (app.email === '' && app.currentPage !== 'email') {
        app.currentPage = 'email';
      }

      const contentText = document.getElementById('contentText');
      let html = '';

      switch(app.currentPage) {
        case 'email':
          html = renderEmailPage();
          break;
        case 'home':
          html = renderHomePage();
          break;
        case 'program':
          html = renderProgramPage();
          break;
        case 'demo':
          html = renderDemoDetail(app.selectedDemoIndex);
          break;
        case 'bookConfirm':
          html = renderBookingConfirm();
          break;
        case 'quiz':
          html = renderQuizStartPage();
          break;
        case 'question':
          html = renderQuestionPage(app.currentQuestion);
          break;
        case 'myDemos':
          html = renderMyDemosPage();
          break;
        case 'myQuiz':
          html = renderMyQuizPage();
          break;
        case 'rating':
          html = renderRatingPage();
          break;
      }

      contentText.innerHTML = html;
      renderKeyboard();
    }

    if (app.email) {
      app.currentPage = 'home';
    } else {
      app.currentPage = 'email';
    }
    render();
  </script>
