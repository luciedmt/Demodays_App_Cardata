      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #121112 0%, #000 100%);

      font-size: clamp(40px, 15vw, 60px);
      margin: 24px 0;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .heart-firework-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }
    .heart-firework {
      position: absolute;
      font-size: 50px;
      pointer-events: none;
    }
    @keyframes heartFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(360deg);
      }
    }

    .heart-firework.animate {
      animation: heartFly 2.5s ease-out forwards;

    function triggerHeartFirework() {
      const container = document.getElementById('heartFireworkContainer');
      container.innerHTML = '';
      // Create multiple hearts that fly across screen
      for (let i = 0; i < 50; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart-firework'
        heart.innerHTML = '♥️';
        // Random starting position near center
        const startX = window.innerWidth / 2 + (Math.random() - 0.5) * 100;
        const startY = window.innerHeight / 2 + (Math.random() - 0.5) * 100;
        heart.style.left = startX + 'px';
        heart.style.top = startY + 'px';
        // Random direction for hearts to fly
        const angle = (Math.random() * Math.PI * 2);
        const velocity = 150 + Math.random() * 200;
        const tx = Math.cos(angle) * velocity;
        const ty = Math.sin(angle) * velocity;
        heart.style.setProperty('--tx', tx + 'px');
        heart.style.setProperty('--ty', ty + 'px');
        // Random delay for staggered animation
        heart.style.animationDelay = (Math.random() * 0.3) + 's';
        container.appendChild(heart);
        // Add animate class to trigger animation
        setTimeout(() => {
          heart.classList.add('animate');
        }, 10);
      }
      // Clear container after animation
      setTimeout(() => {
        container.innerHTML = '';
      }, 3000);
    }

    // Fullscreen functionality for mobile
    function enterFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => {
          console.log('Fullscreen request failed:', err);
        });
      }
    }

    function exitFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(err => {
          console.log('Exit fullscreen failed:', err);
        });
      }
    }

    function updateViewportHeight() {
        const vv = window.visualViewport;
        const height = vv ? vv.height : window.innerHeight;
    
        document.documentElement.style.setProperty(
            '--app-height',
            `${height}px`
        );
    }
    
    updateViewportHeight();

    window.addEventListener('resize', updateViewportHeight);
    window.addEventListener('orientationchange', updateViewportHeight);
    window.visualViewport?.addEventListener('resize', updateViewportHeight);
    window.addEventListener('pageshow', updateViewportHeight);
    
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            updateViewportHeight();
        }
    });

      }, 3000);
    };

    if (app.email) {
      app.currentPage = 'home';
    } else {
      app.currentPage = 'email';
    }
    
    // Premier rendu
    render();
    
    // Premier calcul du viewport
    updateViewportHeight();
    
    // Recalcul après le premier layout
    requestAnimationFrame(() => {
      updateViewportHeight();
    });

</script>

</body>
</html>
